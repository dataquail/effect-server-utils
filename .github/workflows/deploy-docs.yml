name: Deploy Documentation

on:
  workflow_dispatch:
  # Called by `publish.yml` once a package has actually reached the npm
  # registry, so the site the docs describe is never ahead of what is
  # installable. Kept as a reusable workflow rather than a `workflow_run`
  # trigger so the deploy is a job of the publish run: it inherits that run's
  # success as its `needs`, and it shows up in the same check list instead of
  # as a detached run nobody looks at.
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to build the site from, so the docs match the versions the
          calling run published rather than the commit that triggered it.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# A release is one publish run and therefore one call to this workflow, so the
# group is no longer absorbing a fan-out — see the header of `publish.yml` for
# why that fan-out is gone. What is left for it to serialise is a
# `workflow_dispatch` racing a release, or two releases landing close together.
#
# `cancel-in-progress` stays false: GitHub cancels pending runs beyond the
# first, and a cancelled `workflow_call` job fails the publish run that called
# it, so cancellation is never the cheap outcome here. Cancelling mid-deploy
# would also leave Pages serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm run build:website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
