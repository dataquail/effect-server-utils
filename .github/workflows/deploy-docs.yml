name: Deploy Documentation

on:
  workflow_dispatch:
  # Called by `publish.yml` once a package has actually reached the npm
  # registry, so the site the docs describe is never ahead of what is
  # installable. Kept as a reusable workflow rather than a `workflow_run`
  # trigger so the deploy is a job of the publish run: it inherits that run's
  # success as its `needs`, and it shows up in the same check list instead of
  # as a detached run nobody looks at.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# A release of all three packages is three publish runs, but only the `cqrs`
# one calls this workflow — see the `deploy-docs` job in `publish.yml` for why
# a single caller is elected rather than letting the fan-out queue here. This
# group therefore guards the case that is left: a `workflow_dispatch` racing a
# release, or two releases landing close together.
#
# `cancel-in-progress` stays false: GitHub cancels pending runs beyond the
# first, and a cancelled `workflow_call` job fails the publish run that called
# it, so cancellation is never the cheap outcome here. Cancelling mid-deploy
# would also leave Pages serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm run build:website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
