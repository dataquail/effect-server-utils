name: NX release

on:
  push:
    branches:
      - main
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v5

      - name: Lint affected projects
        run: pnpm exec nx affected -t lint --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v5

      - name: Test affected projects
        run: pnpm exec nx affected -t test --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck affected projects
        run: pnpm exec nx affected -t check --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  release:
    needs: [lint, test, check]
    runs-on: ubuntu-latest
    outputs:
      # The commit `nx release` created. Everything downstream must build from
      # this and not from `github.sha`, which is the push that triggered the
      # run and therefore still carries the pre-bump versions.
      released-sha: ${{ steps.release.outputs.released-sha }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout the main branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages for release
        run: pnpm exec nx run-many -t build --projects='packages/*'

      - name: Run nx release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          npx nx release --skip-publish
          echo "released-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # `nx release --skip-publish` above cuts the versions, tags and GitHub
  # releases; this publishes them. Calling the workflow here rather than
  # letting it trigger on `release: created` is the point — that trigger fires
  # once per package, and the resulting fan-out is what caused both the publish
  # race and the docs-deploy cancellations. See the header of `publish.yml`.
  #
  # `publish.sh` no-ops cleanly when every built version is already on the
  # registry, which is what a push that released nothing looks like.
  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release.outputs.released-sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
