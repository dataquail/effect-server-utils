name: Publish

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # `nx release` cuts one GitHub release per package, so this workflow runs
      # once per package and each run has to know which one is its own.
      - name: Identify the package this release is for
        run: |
          TAG_NAME='${{ github.event.release.tag_name }}'
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag — this is a manual dispatch, so every package will be published."
            exit 0
          fi
          # Tags are `@scope/name@version`, so the split is on the *last* `@`.
          # Cutting on the first one returns an empty package name for every
          # scoped package, which is all of them here.
          echo "PACKAGE_NAME=${TAG_NAME%@*}" >> $GITHUB_ENV
          echo "APP_VERSION=${TAG_NAME##*@}" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v5

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        run: ./scripts/publish.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # We need to set provenance to true in order to generate provenance statement
          NPM_CONFIG_PROVENANCE: true
