name: Publish

# One publish run per release, not one per package.
#
# This used to trigger on `release: created`. `nx release` cuts one GitHub
# release per package, so that trigger fanned a single release out into three
# identical runs, and every problem since has been a consequence of that:
#
#   - three runs raced to PUT the same versions, so two took a 403 for
#     publishing over what the third had just pushed (fixed by sharding each
#     run to its own package — see `scripts/publish.sh`);
#   - three runs then called the docs deploy with identical content, and the
#     `pages` concurrency group cancelled the surplus, failing the publish runs
#     that called them.
#
# Both were the fan-out, patched twice. `on-push.yml` now calls this workflow
# once, after `nx release` has cut every release it is going to cut, and
# `scripts/publish.sh` decides for itself which packages still need publishing
# by asking the registry. One run, one decision point, one docs deploy.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to publish from. `on-push.yml` passes the commit `nx release`
          created, since the version bump lands after the push that triggered
          it and the default checkout would build the versions we just
          superseded. Defaults to the triggering ref for a manual run.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v5

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds, resolves `workspace:*`, then publishes whichever packages are
      # not already on the registry at their built version.
      - name: Publish packages
        run: ./scripts/publish.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # We need to set provenance to true in order to generate provenance statement
          NPM_CONFIG_PROVENANCE: true

  # The docs describe the published API, so they are redeployed off the back of
  # a publish that actually landed — `needs: publish` means a run that failed to
  # reach the registry leaves the live site on the last version that did.
  #
  # Permissions are declared here rather than inherited: a called workflow runs
  # with the calling job's token, and the workflow-level block above grants no
  # `pages: write`.
  deploy-docs:
    needs: publish
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
