name: Publish

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # `nx release` cuts one GitHub release per package, so this workflow runs
      # once per package and each run has to know which one is its own.
      - name: Identify the package this release is for
        run: |
          TAG_NAME='${{ github.event.release.tag_name }}'
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag — this is a manual dispatch, so every package will be published."
            exit 0
          fi
          # Tags are `@scope/name@version`, so the split is on the *last* `@`.
          # Cutting on the first one returns an empty package name for every
          # scoped package, which is all of them here.
          echo "PACKAGE_NAME=${TAG_NAME%@*}" >> $GITHUB_ENV
          echo "APP_VERSION=${TAG_NAME##*@}" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v5

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        run: ./scripts/publish.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # We need to set provenance to true in order to generate provenance statement
          NPM_CONFIG_PROVENANCE: true

  # The docs describe the published API, so they are redeployed off the back of
  # a publish that actually landed — `needs: publish` means a run that failed to
  # reach the registry leaves the live site on the last version that did.
  #
  # Permissions are declared here rather than inherited: a called workflow runs
  # with the calling job's token, and the workflow-level block above grants no
  # `pages: write`.
  #
  # Only the `cqrs` release calls this. `nx release` cuts one GitHub release per
  # package, so a full release fans out into three publish runs — and all three
  # used to call this workflow with identical content. The `pages` concurrency
  # group serialised them, but GitHub keeps at most one run *pending* per group
  # and cancels the rest, and a cancelled `workflow_call` job fails its calling
  # run: every release put a red X on a publish that had in fact reached npm.
  # Electing a single caller is what stops that, and `cqrs` is the election
  # because it is the package the other two build on.
  #
  # The cost is that a wave releasing only `authz` and/or `unit-of-work` will
  # not redeploy the site. That is what `workflow_dispatch` on `deploy-docs.yml`
  # is for — run it by hand when the docs need to move without a `cqrs` release.
  deploy-docs:
    needs: publish
    if: startsWith(github.event.release.tag_name, '@effect-server-utils/cqrs@') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
